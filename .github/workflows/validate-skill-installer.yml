name: Validate skill installer

on:
  pull_request:
    types: [synchronize]

jobs:
  test:
    if: ${{ github.head_ref == 'feat/skill-catalog-installer' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/skill-catalog-installer
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.12
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec vitest run test/skill-install.integration.test.ts

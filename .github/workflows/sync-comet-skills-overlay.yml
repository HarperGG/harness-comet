name: Sync Comet skill overlays

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.head_ref == 'fix/comet-skills-verbatim-upstream-overlay' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/comet-skills-verbatim-upstream-overlay
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate managed skills from upstream
        id: generate
        continue-on-error: true
        run: node scripts/run-comet-skill-sync.mjs > overlay-sync.log 2>&1

      - name: Upload sync output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-sync-output
          path: overlay-sync.log

      - name: Commit generated overlays and snapshots
        if: steps.generate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/comet-adapter/assets/comet-skills/playwright test/fixtures/comet-upstream test
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix(comet): regenerate verbatim upstream overlays [skip overlay-sync]"
          git push

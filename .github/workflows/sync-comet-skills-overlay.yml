name: Sync Comet skill overlays

on:
  push:
    branches:
      - fix/comet-skills-verbatim-upstream-overlay

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[skip overlay-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/comet-skills-verbatim-upstream-overlay
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate managed skills from upstream
        run: node scripts/sync-comet-managed-skills.mjs

      - name: Commit generated overlays and snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/comet-adapter/assets/comet-skills/playwright test/fixtures/comet-upstream test
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix(comet): regenerate verbatim upstream overlays [skip overlay-sync]"
          git push

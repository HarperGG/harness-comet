name: Validate Harness-Comet state path migration

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  test:
    if: ${{ github.head_ref == 'fix/remove-root-harness-comet-dir' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-root-harness-comet-dir
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.12
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: node scripts/migrate-harness-comet-state-paths.mjs
      - name: Commit test portability fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/comet-install.integration.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "test: use bash for fake Comet fixture"
            git push
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec vitest run test/comet-install.integration.test.ts test/comet-uninstall.integration.test.ts

name: Validate Harness-Comet state path migration

on:
  pull_request:
    types: [synchronize]

jobs:
  test:
    if: ${{ github.head_ref == 'fix/remove-root-harness-comet-dir' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-root-harness-comet-dir
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.12
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install integration
        id: install
        continue-on-error: true
        run: pnpm exec vitest run test/comet-install.integration.test.ts --reporter=verbose > install-test.log 2>&1
      - name: Upload install test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-comet-install-test-log
          path: install-test.log
      - name: Fail on install test error
        if: steps.install.outcome == 'failure'
        run: exit 1
      - name: Uninstall integration
        run: pnpm exec vitest run test/comet-uninstall.integration.test.ts --reporter=verbose

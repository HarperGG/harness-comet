name: Apply Harness-Comet state path migration

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'fix/remove-root-harness-comet-dir' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-root-harness-comet-dir
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/migrate-harness-comet-state-paths.mjs
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/comet-adapter/src/manifest.ts packages/comet-adapter/src/install.ts test/comet-install.integration.test.ts test/comet-uninstall.integration.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(comet): keep Harness state under .comet"
          git push

name: Validate unified setup command

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    if: ${{ github.head_ref == 'feat/unified-playwright-comet-setup' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-playwright-comet-setup

      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec vitest run test/setup.integration.test.ts

      - name: Run full test suite
        id: full_tests
        continue-on-error: true
        run: pnpm test > vitest-full.log 2>&1

      - name: Upload full test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-setup-vitest-output
          path: vitest-full.log

      - name: Fail when tests fail
        if: steps.full_tests.outcome == 'failure'
        run: exit 1

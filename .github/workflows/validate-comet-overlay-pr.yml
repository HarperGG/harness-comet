name: Validate Comet overlays

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    if: ${{ github.head_ref == 'fix/comet-skills-verbatim-upstream-overlay' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/comet-skills-verbatim-upstream-overlay

      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run test/comet-managed-skills-overlay.test.ts

      - name: Run full test suite
        id: full_tests
        continue-on-error: true
        run: pnpm test > vitest-full.log 2>&1

      - name: Upload full test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-full-output
          path: vitest-full.log

      - name: Fail when full tests fail
        if: steps.full_tests.outcome == 'failure'
        run: exit 1
